apiVersion: 1
groups:
- orgId: 1
  name: Backups
  folder: Monitoring
  interval: 30s
  rules:
  - uid: monitor-9
    title: BackupExpired
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (time() - backup_last_success_timestamp_seconds > 36*3600) * 0 + 1
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: BackupExpired
      description: Project {{ $labels.project }}, service {{ $labels.service }}, instance
        {{ $labels.instance }}
    labels:
      severity: critical
      alert_owner: grafana
    isPaused: false
