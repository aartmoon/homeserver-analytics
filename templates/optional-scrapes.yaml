- job_name: postgres
  static_configs:
  - targets:
    - postgres-exporter:9187
    labels:
      project: infrastructure
      service: postgres
      environment: production
      instance: homeserver
- job_name: traefik
  static_configs:
  - targets:
    - 127.0.0.1:8082
    labels:
      project: infrastructure
      service: traefik
      environment: production
      instance: homeserver
  metric_relabel_configs:
  - source_labels:
    - exported_service
    regex: (shop|media)@docker
    target_label: project
    replacement: cottontoys
  - source_labels:
    - exported_service
    regex: (talk-api|talk-web|talk-media)@docker
    target_label: project
    replacement: talk
  - source_labels:
    - exported_service
    regex: (.+)@docker
    target_label: service
    replacement: $1
  - action: labeldrop
    regex: exported_service
