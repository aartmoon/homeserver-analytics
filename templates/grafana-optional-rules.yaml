apiVersion: 1
groups:
- orgId: 1
  name: Optional sources
  folder: Monitoring
  interval: 30s
  rules:
  - uid: optional-0
    title: PostgresDown
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (pg_up == 0) * 0 + 1
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
    noDataState: OK
    execErrState: Error
    for: 2m
    annotations:
      summary: PostgresDown
    labels:
      severity: critical
      alert_owner: grafana
    isPaused: false
  - uid: optional-1
    title: PostgresConnectionsHigh
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (sum by (project,service,environment,instance) (pg_stat_database_numbackends)
          / on (project,service,environment,instance) pg_settings_max_connections
          > 0.80) * 0 + 1
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: PostgresConnectionsHigh
    labels:
      severity: warning
      alert_owner: grafana
    isPaused: false
  - uid: optional-2
    title: ProxyRepeated5xx
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: ((sum by (project, service, environment, instance) (increase(traefik_service_requests_total{code=~"5.."}[15m]))
          >= 5) and (sum by (project, service, environment, instance) (increase(traefik_service_requests_total{code=~"5.."}[15m]))
          / sum by (project, service, environment, instance) (increase(traefik_service_requests_total[15m]))
          > 0.05) and (sum by (project, service, environment, instance) (increase(traefik_service_requests_total[15m]))
          >= 50)) * 0 + 1
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: ProxyRepeated5xx
    labels:
      severity: warning
      alert_owner: grafana
    isPaused: false
  - uid: optional-3
    title: ProxyP95High
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: ((histogram_quantile(0.95, sum by (le,project,service,environment,instance)
          (rate(traefik_service_request_duration_seconds_bucket[15m]))) > 2.5) and
          (sum by (project, service, environment, instance) (increase(traefik_service_requests_total[15m]))
          >= 100)) * 0 + 1
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: ProxyP95High
    labels:
      severity: warning
      alert_owner: grafana
    isPaused: false
