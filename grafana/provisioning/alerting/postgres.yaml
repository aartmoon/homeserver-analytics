apiVersion: 1
groups:
- orgId: 1
  name: PostgreSQL
  folder: Monitoring
  interval: 30s
  rules:
  - uid: optional-0
    title: PostgresDown
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (pg_up == 0) * 0 + 1
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
    noDataState: OK
    execErrState: Error
    for: 2m
    annotations:
      summary: PostgresDown
    labels:
      severity: critical
      alert_owner: grafana
    isPaused: false
  - uid: optional-1
    title: PostgresConnectionsHigh
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (sum by (project,service,environment,instance) (pg_stat_database_numbackends)
          / on (project,service,environment,instance) pg_settings_max_connections
          > 0.80) * 0 + 1
        instant: true
        range: false
        intervalMs: 30000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: math
        expression: $A > 0
        datasource:
          type: __expr__
          uid: __expr__
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: PostgresConnectionsHigh
    labels:
      severity: warning
      alert_owner: grafana
    isPaused: false
