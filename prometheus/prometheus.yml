global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
- /etc/prometheus/rules/*.yml
scrape_configs:
- job_name: prometheus
  honor_labels: false
  static_configs:
  - targets:
    - 127.0.0.1:9090
    labels:
      project: infrastructure
      service: prometheus
      environment: production
      instance: homeserver
- job_name: node
  honor_labels: true
  static_configs:
  - targets:
    - 127.0.0.1:9100
    labels:
      project: infrastructure
      service: node
      environment: production
      instance: homeserver
- job_name: grafana
  honor_labels: false
  static_configs:
  - targets:
    - 127.0.0.1:3001
    labels:
      project: infrastructure
      service: grafana
      environment: production
      instance: homeserver
- job_name: blackbox
  honor_labels: false
  static_configs:
  - targets:
    - 127.0.0.1:9115
    labels:
      project: infrastructure
      service: blackbox
      environment: production
      instance: homeserver
- job_name: http
  scrape_interval: 60s
  scrape_timeout: 15s
  metrics_path: /probe
  file_sd_configs:
  - files:
    - /etc/prometheus/targets/http.json
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - module
    target_label: __param_module
  - target_label: __address__
    replacement: 127.0.0.1:9115
  - action: labeldrop
    regex: module
- job_name: postgres
  static_configs:
  - targets:
    - 127.0.0.1:9187
    labels:
      project: infrastructure
      service: postgres
      environment: production
      instance: homeserver
- job_name: traefik
  static_configs:
  - targets:
    - 127.0.0.1:8082
    labels:
      project: infrastructure
      service: traefik
      environment: production
      instance: homeserver
  metric_relabel_configs:
  - source_labels:
    - exported_service
    regex: (shop|media)@docker
    target_label: project
    replacement: cottontoys
  - source_labels:
    - exported_service
    regex: (talk-api|talk-web|talk-media)@docker
    target_label: project
    replacement: talk
  - source_labels:
    - exported_service
    regex: (.+)@docker
    target_label: service
    replacement: $1
  - action: labeldrop
    regex: exported_service
